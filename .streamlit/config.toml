primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FA"
textColor = "#1E293B"
borderColor = "#E2E8F0"
font = "sans-serif"
baseFontSize = 15
headingFontSizes = ["30px", "25px", "20px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
